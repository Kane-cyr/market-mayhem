<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Market God · MARKET MAYHEM admin</title>
<style>
:root{--bg:#0f121a;--bg2:#131722;--panel:#161a25;--panel2:#1f2430;--panel3:#2a2e39;--line:#232836;--line2:#2f3545;--text:#d1d4dc;--dim:#a3a6af;--mute:#787b86;--up:#089981;--down:#f23645;--gold:#f7a600;--accent:#2962ff;--r:4px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:var(--text)}button{cursor:pointer;border:1px solid var(--line2);background:transparent;border-radius:var(--r);padding:5px 10px}button:hover{background:var(--panel2)}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{border-color:#f2364566;color:#f7525f}button.gold{background:var(--gold);border-color:var(--gold);color:#131722;font-weight:600}button.sm{padding:2px 8px;font-size:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:6px 9px;width:100%}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;align-items:center;gap:12px;padding:0 14px;height:48px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:5}
.mk{width:28px;height:28px;border-radius:5px;background:var(--gold);display:grid;place-items:center;color:#131722;font-weight:900}
h1{font-size:14px;margin:0;letter-spacing:.04em}.spacer{flex:1}.mute{color:var(--mute)}.dim{color:var(--dim)}.up{color:var(--up)}.down{color:var(--down)}.gold{color:var(--gold)}.mono{font-family:var(--mono)}.xs{font-size:11px}.b{font-weight:600}
main{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;align-items:start;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}.card+.card{margin-top:12px}
h2{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px;align-items:center}h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;color:var(--mute)}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:var(--mute);text-align:left;font-weight:500;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;padding:0 6px;border-radius:3px;font-size:11px;line-height:18px;background:var(--panel3);color:var(--dim);margin-right:4px;white-space:nowrap}.chip.r{background:#f2364522;color:#f7525f}.chip.g{background:#08998122;color:#22ab94}.chip.y{background:#f7a60022;color:var(--gold)}
.ctl{display:grid;grid-template-columns:44px 1fr 46px;align-items:center;gap:6px;font-size:11px;color:var(--mute)}.ctl input[type=range]{padding:0;accent-color:var(--gold)}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.row2 input{width:110px}
label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mute);margin-bottom:8px}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;margin-bottom:8px}.seg button{flex:1;border:0;border-radius:0}.seg button.on{background:var(--panel3);color:#fff}
.impact{font-family:var(--mono);font-size:22px;font-weight:600;text-align:center;margin:2px 0 6px}
.preview{border:1px solid var(--line2);border-left:3px solid var(--down);border-radius:var(--r);padding:8px 10px;margin:6px 0 10px;background:var(--bg)}.preview .t{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--down)}
.login{max-width:340px;margin:12vh auto;text-align:center}.login .card{text-align:left}
#toast{position:fixed;right:14px;bottom:14px;padding:9px 12px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);display:none;max-width:340px}
.empty{padding:16px;text-align:center;color:var(--mute)}
@media(max-width:1000px){main{grid-template-columns:minmax(0,1fr)}.tw{overflow-x:auto}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
'use strict';
// Market God admin panel. Talks only to /api/admin with the admin password in a header.
// Everything rendered from the server is escaped.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = c => c == null ? '—' : '$' + Math.round(c / 100).toLocaleString('en-US');
const pctS = r => r == null ? '—' : (r >= 0 ? '+' : '') + (r * 100).toFixed(1) + '%';
const ago = d => { if (!d) return 'never'; const m = (Date.now() - new Date(d)) / 6e4; return m < 1 ? 'just now' : m < 60 ? Math.round(m) + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
let KEY = sessionStorage.getItem('mm.admin') || '', ST = { week: '', data: null, companies: [], ev: { kind: 'announce', mag: 15, ticker: '', who: 'The President', text: '', day: '', target: '' } };
function toast(t, bad) { const el = $('toast'); el.textContent = t; el.style.borderLeftColor = bad ? 'var(--down)' : 'var(--up)'; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', 3500); }
async function api(op, body = {}) {
  const r = await fetch('/api/admin?op=' + op, { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': KEY }, body: JSON.stringify({ week: ST.week, ...body }) });
  const j = await r.json().catch(() => ({ error: 'Bad response' }));
  if (r.status === 401) { KEY = ''; sessionStorage.removeItem('mm.admin'); render(); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || 'Request failed'); return j;
}
async function load() { try { ST.data = await api('overview'); ST.week ||= ST.data.week; if (!ST.companies.length) ST.companies = (await api('companies')).companies; render(); } catch (e) { toast(e.message, 1); } }
async function act(op, body, msg) { try { await api(op, body); toast(msg); await load(); } catch (e) { toast(e.message, 1); } }

function loginView() {
  return `<div class="login"><div class="mk" style="margin:0 auto 12px;width:44px;height:44px;font-size:20px">⚡</div><h1 style="margin-bottom:14px">MARKET GOD</h1>
  <form class="card" id="lf"><label>Admin password<input id="pw" type="password" autocomplete="current-password" autofocus></label><button class="primary" style="width:100%">Enter</button></form></div>`;
}
const volLabel = v => v.toFixed(2) + '×';
function playerRow(p) {
  const r = p.run;
  const status = r ? `<span class="chip ${r.status === 'submitted' ? 'g' : r.status === 'rejected' ? 'r' : ''}">${esc(r.status)}</span>${r.rigged ? '<span class="chip y">rigged</span>' : ''}${r.suspect ? '<span class="chip r" title="Went back in time: probably reloaded a save">suspect</span>' : ''}<div class="mono">${money(r.nw)} <span class="${r.ret >= 0 ? 'up' : 'down'}">${pctS(r.ret)}</span></div>${r.reason ? `<div class="xs down">${esc(r.reason)}</div>` : ''}` : '<span class="mute xs">not started</span>';
  return `<tr data-id="${esc(p.id)}"><td><div class="b">${esc(p.nickname)}</div><div class="xs mute">seen ${ago(p.lastSeen)}</div>${p.banned ? `<span class="chip r">banned</span><div class="xs down">${esc(p.reason || '')}</div>` : ''}${p.locked ? '<span class="chip y">locked out</span>' : ''}</td>
  <td>${status}</td>
  <td style="min-width:230px"><div class="ctl"><span>Vol</span><input type="range" min="-2" max="2" step="0.1" value="${Math.log2(p.vol).toFixed(1)}" data-k="vol"><span class="mono" data-o="vol">${volLabel(p.vol)}</span></div>
    <div class="ctl"><span>Luck</span><input type="range" min="-1" max="1" step="0.05" value="${p.luck}" data-k="luck"><span class="mono" data-o="luck">${p.luck > 0 ? '+' : ''}${p.luck.toFixed(2)}</span></div>
    <div class="row2"><button class="sm gold" data-a="mods">Apply</button><button class="sm" data-a="normal">Reset to fair</button></div></td>
  <td style="min-width:180px"><div class="row2" style="margin-top:0"><input type="number" placeholder="$ e.g. 5000 / -2500" data-k="cash" aria-label="Cash amount"><button class="sm" data-a="cash">Send</button></div>
    <div class="row2">${p.banned ? '<button class="sm" data-a="unban">Unban</button>' : '<button class="sm danger" data-a="ban">Ban</button>'}${r ? `<button class="sm" data-a="reset" title="Delete this week's run so they can play again">Reset run</button>${r.status === 'submitted' ? '<button class="sm danger" data-a="remove">Remove score</button>' : ''}` : ''}${p.locked ? '<button class="sm" data-a="unlock">Unlock</button>' : ''}<button class="sm" data-a="pin">New PIN</button></div></td></tr>`;
}
function godPanel() {
  const e = ST.ev, co = ST.companies, players = ST.data?.players || [], c = co.find(x => x.ticker === e.ticker);
  const isA = e.kind === 'announce', mag = isA ? e.mag : Math.abs(e.mag);
  const head = isA ? `${e.who || 'A Very Important Person'}: "${e.text || '…'}"` : e.kind === 'boom' ? 'Euphoric buying sweeps the market' : 'Mystery sell-off rips through the market';
  return `<div class="card"><h2>⚡ Market God</h2>
  <div class="seg">${[['announce', 'Announcement'], ['boom', 'Boom'], ['crash', 'Crash']].map(([k, l]) => `<button class="${e.kind === k ? 'on' : ''}" data-ev="${k}">${l}</button>`).join('')}</div>
  ${isA ? `<label>Company<select id="ev-ticker"><option value="">Pick a company…</option>${co.map(x => `<option value="${esc(x.ticker)}" ${x.ticker === e.ticker ? 'selected' : ''}>${esc(x.ticker)} · ${esc(x.name)}</option>`).join('')}</select></label>
  <label>Who says it<input id="ev-who" maxlength="40" value="${esc(e.who)}" placeholder="The President"></label>
  <label>What they say<textarea id="ev-text" maxlength="160" rows="2" placeholder="${c ? esc(c.name) + ' makes great products. The best.' : 'They make great computers.'}">${esc(e.text)}</textarea></label>` : ''}
  <label>Impact ${isA ? '(negative = the stock tanks)' : 'on the whole market'}<input type="range" id="ev-mag" min="${isA ? -40 : 1}" max="40" step="1" value="${mag}"></label>
  <div class="impact ${(isA ? mag : e.kind === 'boom' ? 1 : -1) >= 0 ? 'up' : 'down'}">${isA ? (mag >= 0 ? '+' : '') + mag : (e.kind === 'boom' ? '+' : '−') + mag}%</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label>Who sees it<select id="ev-target"><option value="">Everyone</option>${players.map(p => `<option value="${esc(p.id)}" ${e.target === p.id ? 'selected' : ''}>Only ${esc(p.nickname)}</option>`).join('')}</select></label>
  <label>When<select id="ev-day"><option value="">As soon as possible</option>${Array.from({ length: 25 }, (_, i) => `<option value="${i}" ${String(e.day) === String(i) ? 'selected' : ''}>Game day ${i}</option>`).join('')}</select></label></div>
  <div class="preview"><div class="t">BREAKING</div><div class="b">${esc(head)}</div></div>
  <button class="gold" style="width:100%" id="ev-go" ${isA && !e.ticker ? 'disabled' : ''}>Unleash it</button>
  <div class="xs mute" style="margin-top:8px">Players online get it at their next game day. Players who start later this week get it at the chosen day.</div></div>
  <div class="card"><h2>This week's events <span class="r">${(ST.data?.events || []).length}</span></h2>${(ST.data?.events || []).slice().reverse().map(x => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="chip ${x.kind === 'crash' || x.magnitude < 0 ? 'r' : 'g'}">${esc(x.kind)} ${x.magnitude >= 0 ? '+' : ''}${Math.round(x.magnitude * 100)}%</span>${x.ticker ? `<b>${esc(x.ticker)}</b> ` : ''}<span class="dim">${x.headline ? '“' + esc(x.headline) + '”' : ''}</span><div class="xs mute">${x.player_id ? 'one player' : 'everyone'} · ${x.game_day == null ? 'asap' : 'day ' + x.game_day}</div></div>`).join('') || '<div class="empty">None yet.</div>'}</div>`;
}
function mainView() {
  const d = ST.data; if (!d) return '<header><div class="mk">⚡</div><h1>MARKET GOD</h1></header><div class="empty">Loading…</div>';
  const ps = d.players.slice().sort((a, b) => (b.run?.nw ?? -1) - (a.run?.nw ?? -1));
  const sub = d.players.filter(p => p.run?.status === 'submitted').length;
  return `<header><div class="mk">⚡</div><h1>MARKET GOD</h1><span class="mute xs">MARKET MAYHEM admin</span><span class="spacer"></span>
    <input id="week" value="${esc(ST.week)}" style="width:110px" aria-label="Week"><button id="refresh">Refresh</button><button id="logout" class="sm">Lock</button></header>
  <main><div><div class="card"><h2>Players <span class="r">${d.players.length} players · ${sub} scores this week</span></h2>
    <div class="tw"><table><thead><tr><th>Player</th><th>This week</th><th>Their market (secret)</th><th>Actions</th></tr></thead><tbody>${ps.map(playerRow).join('') || '<tr><td colspan="4" class="empty">No players yet. Share the game link.</td></tr>'}</tbody></table></div>
    <div class="xs mute" style="margin-top:8px">Vol scales how wildly their stocks move (0.25× calm to 4× chaos). Luck tilts the stocks they own: +1 drifts them up, −1 drags them down. Changes reach a player at their next game day. "Rigged" marks runs you touched; only you can see it.</div></div></div>
  <div>${godPanel()}</div></main>`;
}
function render() { $('app').innerHTML = KEY ? mainView() : loginView(); }

document.addEventListener('submit', e => { if (e.target.id === 'lf') { e.preventDefault(); KEY = $('pw').value; sessionStorage.setItem('mm.admin', KEY); render(); load(); } });
document.addEventListener('input', e => {
  const k = e.target.dataset.k, tr = e.target.closest('tr');
  if (k === 'vol' && tr) tr.querySelector('[data-o=vol]').textContent = volLabel(2 ** Number(e.target.value));
  if (k === 'luck' && tr) { const v = Number(e.target.value); tr.querySelector('[data-o=luck]').textContent = (v > 0 ? '+' : '') + v.toFixed(2); }
  if (e.target.id === 'ev-mag') { ST.ev.mag = Number(e.target.value); syncEv(); }
  if (['ev-who', 'ev-text'].includes(e.target.id)) { ST.ev[e.target.id === 'ev-who' ? 'who' : 'text'] = e.target.value; const pv = document.querySelector('.preview .b'); if (pv) pv.textContent = `${ST.ev.who || 'A Very Important Person'}: "${ST.ev.text || '…'}"`; }
});
function syncEv() { const box = document.querySelector('.impact'); if (!box) return; const e = ST.ev, isA = e.kind === 'announce', v = isA ? e.mag : (e.kind === 'boom' ? 1 : -1) * Math.abs(e.mag); box.textContent = (v >= 0 ? '+' : '−') + Math.abs(v) + '%'; box.className = 'impact ' + (v >= 0 ? 'up' : 'down'); }
document.addEventListener('change', e => {
  if (e.target.id === 'ev-ticker') { ST.ev.ticker = e.target.value; render(); }
  if (e.target.id === 'ev-target') ST.ev.target = e.target.value;
  if (e.target.id === 'ev-day') ST.ev.day = e.target.value;
  if (e.target.id === 'week') { ST.week = e.target.value.trim(); ST.companies = []; load(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'refresh') return load();
  if (b.id === 'logout') { KEY = ''; sessionStorage.removeItem('mm.admin'); return render(); }
  if (b.dataset.ev) { ST.ev.kind = b.dataset.ev; if (b.dataset.ev !== 'announce') ST.ev.mag = Math.max(1, Math.abs(ST.ev.mag)); return render(); }
  if (b.id === 'ev-go') { const v = ST.ev, isA = v.kind === 'announce'; return act('event', { kind: v.kind, magnitude: (isA ? v.mag : Math.abs(v.mag)) / 100, ticker: v.ticker, speaker: v.who, headline: v.text, day: v.day, playerId: v.target || null }, isA ? `Announcement queued: ${v.ticker} ${v.mag >= 0 ? '+' : ''}${v.mag}%` : `${v.kind} queued`).then(() => { ST.ev.text = ''; render(); }); }
  const tr = b.closest('tr'); if (!tr) return; const playerId = tr.dataset.id, a = b.dataset.a, p = ST.data.players.find(x => x.id === playerId), name = p?.nickname;
  if (a === 'mods') return act('mods', { playerId, vol: 2 ** Number(tr.querySelector('[data-k=vol]').value), luck: Number(tr.querySelector('[data-k=luck]').value) }, `Updated ${name}'s market`);
  if (a === 'normal') return act('mods', { playerId, vol: 1, luck: 0 }, `${name} is back to a fair market`);
  if (a === 'cash') { const v = Number(tr.querySelector('[data-k=cash]').value); if (!v) return toast('Enter an amount', 1); return act('cash', { playerId, amount: v }, `${v > 0 ? 'Sent' : 'Fined'} ${name} $${Math.abs(v).toLocaleString('en-US')}`); }
  if (a === 'ban') { const reason = prompt(`Ban ${name}? Reason (shown to them):`, 'Cheating'); if (reason == null) return; return act('ban', { playerId, banned: true, reason }, `${name} banned`); }
  if (a === 'unban') return act('ban', { playerId, banned: false }, `${name} unbanned`);
  if (a === 'unlock') return act('unlock', { playerId }, `${name} unlocked`);
  if (a === 'pin') { const pin = prompt(`New 4-digit PIN for ${name}:`); if (!pin) return; return act('resetPin', { playerId, pin }, `${name}'s PIN changed`); }
  if (a === 'reset') { if (!confirm(`Delete ${name}'s run this week? They can start again.`)) return; return act('resetRun', { runId: p.run.id }, `${name}'s run reset`); }
  if (a === 'remove') { if (!confirm(`Remove ${name}'s score from the leaderboard?`)) return; return act('removeRun', { runId: p.run.id }, `${name}'s score removed`); }
});
render(); if (KEY) load();
setInterval(() => { if (KEY && document.visibilityState === 'visible' && !document.activeElement?.matches('input,textarea,select')) load(); }, 20000);
</script>
</body>
</html>
