<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Market God · MARKET MAYHEM admin</title>
<style>
:root{--bg:#0f121a;--bg2:#131722;--panel:#161a25;--panel2:#1f2430;--panel3:#2a2e39;--line:#232836;--line2:#2f3545;--text:#d1d4dc;--dim:#a3a6af;--mute:#787b86;--up:#089981;--down:#f23645;--gold:#f7a600;--accent:#2962ff;--r:4px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:var(--text)}button{cursor:pointer;border:1px solid var(--line2);background:transparent;border-radius:var(--r);padding:5px 10px}button:hover{background:var(--panel2)}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{border-color:#f2364566;color:#f7525f}button.gold{background:var(--gold);border-color:var(--gold);color:#131722;font-weight:600}button.sm{padding:2px 8px;font-size:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:6px 9px;width:100%}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;align-items:center;gap:12px;padding:0 14px;height:48px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:5}
.mk{width:28px;height:28px;border-radius:5px;background:var(--gold);display:grid;place-items:center;color:#131722;font-weight:900}
h1{font-size:14px;margin:0;letter-spacing:.04em}.spacer{flex:1}.mute{color:var(--mute)}.dim{color:var(--dim)}.up{color:var(--up)}.down{color:var(--down)}.gold{color:var(--gold)}.mono{font-family:var(--mono)}.xs{font-size:11px}.b{font-weight:600}
main{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;align-items:start;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}.card+.card{margin-top:12px}
h2{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px;align-items:center}h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;color:var(--mute)}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:var(--mute);text-align:left;font-weight:500;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;padding:0 6px;border-radius:3px;font-size:11px;line-height:18px;background:var(--panel3);color:var(--dim);margin-right:4px;white-space:nowrap}.chip.r{background:#f2364522;color:#f7525f}.chip.g{background:#08998122;color:#22ab94}.chip.y{background:#f7a60022;color:var(--gold)}
.ctl{display:grid;grid-template-columns:44px 1fr 46px;align-items:center;gap:6px;font-size:11px;color:var(--mute)}.ctl input[type=range]{padding:0;accent-color:var(--gold)}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.row2 input{width:110px}
label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mute);margin-bottom:8px}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;margin-bottom:8px}.seg button{flex:1;border:0;border-radius:0}.seg button.on{background:var(--panel3);color:#fff}
.impact{font-family:var(--mono);font-size:22px;font-weight:600;text-align:center;margin:2px 0 6px}
.preview{border:1px solid var(--line2);border-left:3px solid var(--down);border-radius:var(--r);padding:8px 10px;margin:6px 0 10px;background:var(--bg)}.preview .t{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--down)}
.login{max-width:340px;margin:12vh auto;text-align:center}.login .card{text-align:left}
#toast{position:fixed;right:14px;bottom:14px;padding:9px 12px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);display:none;max-width:340px}
.empty{padding:16px;text-align:center;color:var(--mute)}
@media(max-width:1000px){main{grid-template-columns:minmax(0,1fr)}.tw{overflow-x:auto}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
'use strict';
// Market God admin panel. Talks only to /api/admin with the admin password in a header.
// Everything rendered from the server is escaped.
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = c => c == null ? '—' : '$' + Math.round(c / 100).toLocaleString('en-US');
const pctS = r => r == null ? '—' : (r >= 0 ? '+' : '') + (r * 100).toFixed(1) + '%';
const ago = d => { if (!d) return 'never'; const m = (Date.now() - new Date(d)) / 6e4; return m < 1 ? 'just now' : m < 60 ? Math.round(m) + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
let KEY = sessionStorage.getItem('mm.admin') || '', ST = { week: '', data: null, companies: [], ev: { kind: 'announce', mag: 15, ticker: '', who: 'The President', text: '', day: '', target: '', dir: 1, unit: 'pct', amt: 25, dur: 3 } };
function toast(t, bad) { const el = $('toast'); el.textContent = t; el.style.borderLeftColor = bad ? 'var(--down)' : 'var(--up)'; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', 3500); }
async function api(op, body = {}) {
  const r = await fetch('/api/admin?op=' + op, { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': KEY }, body: JSON.stringify({ week: ST.week, ...body }) });
  const j = await r.json().catch(() => ({ error: 'Bad response' }));
  if (r.status === 401) { KEY = ''; sessionStorage.removeItem('mm.admin'); render(); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || 'Request failed'); return j;
}
async function load() { try { [ST.data, ST.chals] = await Promise.all([api('overview'), api('challenges').then(r => r.challenges).catch(() => [])]); ST.week ||= ST.data.week; if (!ST.companies.length) ST.companies = (await api('companies')).companies; render(); } catch (e) { toast(e.message, 1); } }
async function act(op, body, msg) { try { await api(op, body); toast(msg); await load(); } catch (e) { toast(e.message, 1); } }

function loginView() {
  return `<div class="login"><div class="mk" style="margin:0 auto 12px;width:44px;height:44px;font-size:20px">⚡</div><h1 style="margin-bottom:14px">MARKET GOD</h1>
  <form class="card" id="lf"><label>Admin password<input id="pw" type="password" autocomplete="current-password" autofocus></label><button class="primary" style="width:100%">Enter</button></form></div>`;
}
const volLabel = v => v.toFixed(2) + '×';
function playerRow(p) {
  const r = p.run;
  const status = r ? `<span class="chip ${r.status === 'submitted' ? 'g' : r.status === 'rejected' ? 'r' : ''}">${esc(r.status)}</span>${r.rigged ? '<span class="chip y">rigged</span>' : ''}${r.suspect ? '<span class="chip r" title="Went back in time: probably reloaded a save">suspect</span>' : ''}<div class="mono">${money(r.nw)} <span class="${r.ret >= 0 ? 'up' : 'down'}">${pctS(r.ret)}</span></div>${r.reason ? `<div class="xs down">${esc(r.reason)}</div>` : ''}` : '<span class="mute xs">not started</span>';
  const m = p.money;
  const moneyCell = `<td>${m ? `<div class="mono b">${money(m.nw)}</div><div class="xs mute">cash ${money(m.cash)}</div>${m.debt > 0 ? `<div class="xs down">owes sharks ${money(m.debt)}</div>` : ''}${m.heat >= 20 ? `<div class="xs gold">insider heat ${m.heat}</div>` : ''}<div class="xs mute">${esc(m.mode)} · ${ago(m.at)}</div>` : '<div class="xs mute">no data yet</div>'}<button class="sm" data-a="inspect" style="margin-top:4px">Inspect</button></td>`;
  return `<tr data-id="${esc(p.id)}"><td><div class="b">${esc(p.nickname)}</div><div class="xs mute">seen ${ago(p.lastSeen)}</div>${p.banned ? `<span class="chip r">banned</span><div class="xs down">${esc(p.reason || '')}</div>` : ''}${p.locked ? '<span class="chip y">locked out</span>' : ''}</td>
${moneyCell}<td>${status}</td>
  <td style="min-width:230px"><div class="ctl"><span>Vol</span><input type="range" min="-2" max="2" step="0.1" value="${Math.log2(p.vol).toFixed(1)}" data-k="vol"><span class="mono" data-o="vol">${volLabel(p.vol)}</span></div>
    <div class="ctl"><span>Luck</span><input type="range" min="-1" max="1" step="0.05" value="${p.luck}" data-k="luck"><span class="mono" data-o="luck">${p.luck > 0 ? '+' : ''}${p.luck.toFixed(2)}</span></div>
    <div class="row2"><button class="sm gold" data-a="mods">Apply</button><button class="sm" data-a="normal">Reset to fair</button></div></td>
  <td style="min-width:180px"><div class="row2" style="margin-top:0"><input type="number" placeholder="$ e.g. 5000 / -2500" data-k="cash" aria-label="Cash amount"><button class="sm" data-a="cash">Send</button></div><input placeholder="Message from the Market God (optional)" data-k="note" maxlength="200" aria-label="Message" style="margin-top:6px;font-size:12px">
    <div class="row2">${p.banned ? '<button class="sm" data-a="unban">Unban</button>' : '<button class="sm danger" data-a="ban">Ban</button>'}${r ? `<button class="sm" data-a="reset" title="Delete this week's run so they can play again">Reset run</button>${r.status === 'submitted' ? '<button class="sm danger" data-a="remove">Remove score</button>' : ''}` : ''}${p.locked ? '<button class="sm" data-a="unlock">Unlock</button>' : ''}<button class="sm" data-a="pin">New PIN</button><button class="sm" data-a="wipe" title="Start this player over with $10,000">Reset to $10k</button></div></td></tr>`;
}
function godPanel() {
  const e = ST.ev, co = ST.companies, players = ST.data?.players || [], c = co.find(x => x.ticker === e.ticker);
  const isA = e.kind === 'announce', mag = isA ? e.mag : Math.abs(e.mag);
  const head = isA ? `${e.who || 'A Very Important Person'}: "${e.text || '…'}"` : e.kind === 'boom' ? 'Euphoric buying sweeps the market' : 'Mystery sell-off rips through the market';
  return `<div class="card"><h2>⚡ Market God</h2>
  <div class="seg">${[['announce', 'Announcement'], ['boom', 'Boom'], ['crash', 'Crash']].map(([k, l]) => `<button class="${e.kind === k ? 'on' : ''}" data-ev="${k}">${l}</button>`).join('')}</div>
  ${isA ? `<button class="sm danger" id="ev-rug" style="width:100%;margin-bottom:8px" title="Fill in a rug pull: the developers vanish and the stock collapses 85% straight away">🧶 Rug pull preset</button>` : ''}
  ${isA ? `<label>Company<select id="ev-ticker"><option value="">Pick a company…</option>${co.map(x => `<option value="${esc(x.ticker)}" ${x.ticker === e.ticker ? 'selected' : ''}>${esc(x.ticker)} · ${esc(x.name)}</option>`).join('')}</select></label>
  <label>Who says it<input id="ev-who" maxlength="40" value="${esc(e.who)}" placeholder="The President"></label>
  <label>What they say<textarea id="ev-text" maxlength="160" rows="2" placeholder="${c ? esc(c.name) + ' makes great products. The best.' : 'They make great computers.'}">${esc(e.text)}</textarea></label>` : ''}
  ${isA ? `<div class="seg"><button class="${e.dir > 0 ? 'on' : ''}" data-dir="1">Goes up</button><button class="${e.dir < 0 ? 'on' : ''}" data-dir="-1">Goes down</button></div>
  <div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end"><label>How much per share<input type="number" id="ev-amt" min="0" step="any" value="${esc(e.amt)}" placeholder="${e.unit === 'usd' ? 'e.g. 10' : 'e.g. 25'}"></label>
  <div class="seg" style="margin-bottom:8px"><button class="${e.unit === 'pct' ? 'on' : ''}" data-unit="pct">%</button><button class="${e.unit === 'usd' ? 'on' : ''}" data-unit="usd">$</button></div></div>
  <label>Over how long<select id="ev-dur">${[[0, 'Straight away'], [1, '1 game day'], [2, '2 game days'], [3, '3 game days'], [5, '5 game days'], [7, '1 game week'], [10, '10 game days'], [14, '2 game weeks'], [21, '3 game weeks'], [24, 'The whole 24 days']].map(([v, l]) => `<option value="${v}" ${Number(e.dur) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
  <div class="impact ${e.dir > 0 ? 'up' : 'down'}">${e.dir > 0 ? '+' : '−'}${e.unit === 'usd' ? '$' : ''}${esc(e.amt || 0)}${e.unit === 'usd' ? '' : '%'}</div>`
  : `<label>Impact on the whole market<input type="range" id="ev-mag" min="1" max="40" step="1" value="${mag}"></label>
  <div class="impact ${e.kind === 'boom' ? 'up' : 'down'}">${e.kind === 'boom' ? '+' : '−'}${mag}%</div>`}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label>Who sees it<select id="ev-target"><option value="">Everyone</option>${players.map(p => `<option value="${esc(p.id)}" ${e.target === p.id ? 'selected' : ''}>Only ${esc(p.nickname)}</option>`).join('')}</select></label>
  <label>When<select id="ev-day"><option value="">As soon as possible</option>${Array.from({ length: 25 }, (_, i) => `<option value="${i}" ${String(e.day) === String(i) ? 'selected' : ''}>Game day ${i}</option>`).join('')}</select></label></div>
  <div class="preview"><div class="t">BREAKING</div><div class="b">${esc(head)}</div>${isA && e.ticker ? `<div class="xs mute" style="margin-top:4px">${esc(e.ticker)} ${e.dir > 0 ? 'rises' : 'falls'} ${e.unit === 'usd' ? '$' + esc(e.amt || 0) + ' a share' : esc(e.amt || 0) + '%'} ${Number(e.dur) ? 'over ' + e.dur + ' game day' + (Number(e.dur) === 1 ? '' : 's') : 'straight away'}</div>` : ''}</div>
  <button class="gold" style="width:100%" id="ev-go" ${isA && (!e.ticker || !(Number(e.amt) > 0)) ? 'disabled' : ''}>Unleash it</button>
  <div class="xs mute" style="margin-top:8px">Players online get it at their next game day. Players who start later this week get it at the chosen day.</div></div>
  <div class="card"><h2>This week's events <span class="r">${(ST.data?.events || []).length}</span></h2>${(ST.data?.events || []).slice().reverse().map(x => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="chip ${x.kind === 'crash' || x.magnitude < 0 ? 'r' : 'g'}">${x.unit ? (x.amount >= 0 ? '+' : '−') + (x.unit === 'usd' ? '$' : '') + Math.abs(x.amount) + (x.unit === 'usd' ? '' : '%') + (x.duration_days ? ' over ' + x.duration_days + 'd' : '') : esc(x.kind) + ' ' + (x.magnitude >= 0 ? '+' : '') + Math.round(x.magnitude * 100) + '%'}</span>${x.ticker ? `<b>${esc(x.ticker)}</b> ` : ''}<span class="dim">${x.headline ? '“' + esc(x.headline) + '”' : ''}</span><div class="xs mute">${x.player_id ? 'one player' : 'everyone'} · ${x.game_day == null ? 'asap' : 'day ' + x.game_day}</div></div>`).join('') || '<div class="empty">None yet.</div>'}</div>`;
}
const CF = { title: 'Burn a billion', goal: 'least', start: 1000000000, prize: 1000000, days: 3, sel: {} };
const usd = n => '$' + Number(n || 0).toLocaleString('en-US');
function chalPanel() {
  const ps = ST.data?.players || [], list = ST.chals || [];
  return `<div class="card"><h2>⚡ Challenge</h2>
  <label>Name<input id="cf-title" maxlength="80" value="${esc(CF.title)}"></label>
  <div class="seg"><button class="${CF.goal === 'least' ? 'on' : ''}" data-goal="least">Lose the most</button><button class="${CF.goal === 'most' ? 'on' : ''}" data-goal="most">Make the most</button></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label>Starting money ($)<input id="cf-start" type="number" min="1" value="${esc(CF.start)}"></label><label>Prize ($)<input id="cf-prize" type="number" min="0" value="${esc(CF.prize)}"></label></div>
  <label>How long<select id="cf-days">${[1, 2, 3, 5, 7, 10, 14, 24].map(d => `<option value="${d}" ${CF.days === d ? 'selected' : ''}>${d} game day${d === 1 ? '' : 's'}</option>`).join('')}</select></label>
  <div class="xs mute" style="margin-bottom:4px">Who takes part <button class="sm" data-pickall="1" style="margin-left:6px">${ps.length && ps.every(p => CF.sel[p.id]) ? 'None' : 'All'}</button></div>
  <div style="max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:8px">${ps.map(p => `<label style="flex-direction:row;align-items:center;gap:6px;margin:0 0 4px;color:var(--text)"><input type="checkbox" data-pick="${esc(p.id)}" ${CF.sel[p.id] ? 'checked' : ''} style="width:auto">${esc(p.nickname)}</label>`).join('') || '<div class="xs mute">No players yet.</div>'}</div>
  <div class="xs mute" style="margin-bottom:8px">Everyone picked plays the same market starting with ${usd(CF.start)}. ${CF.goal === 'least' ? 'Lowest' : 'Highest'} finishing balance wins ${usd(CF.prize)} when you end it.</div>
  <button class="gold" style="width:100%" id="cf-go">Send the challenge</button></div>
  <div class="card"><h2>Challenges <span class="r">${list.length}</span></h2>${list.map(c => `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
    <div style="display:flex;gap:6px;align-items:center"><b>${esc(c.title)}</b><span class="chip ${c.status === 'open' ? 'g' : ''}">${esc(c.status)}</span><span class="spacer"></span>${c.status === 'open' ? `<button class="sm gold" data-cclose="${esc(c.id)}">End & pay prize</button>` : ''}</div>
    <div class="xs mute">${c.goal === 'least' ? 'Lose the most' : 'Make the most'} · start ${usd(c.startCash / 100)} · prize ${usd(c.prize / 100)} · ${c.days}d${c.winner ? ' · winner <b class="gold">' + esc(c.winner) + '</b>' : ''}</div>
    ${c.rows.map((r, i) => `<div class="xs" style="display:flex;justify-content:space-between"><span>${r.nw != null ? '#' + (i + 1) + ' ' : ''}${esc(r.nickname)}</span><span class="mono">${r.nw != null ? money(r.nw) + ' ' + pctS(r.ret) : esc(r.state)}</span></div>`).join('')}</div>`).join('') || '<div class="empty">None yet.</div>'}</div>`;
}
function mainView() {
  const d = ST.data; if (!d) return '<header><div class="mk">⚡</div><h1>MARKET GOD</h1></header><div class="empty">Loading…</div>';
  const ps = d.players.slice().sort((a, b) => (b.run?.nw ?? -1) - (a.run?.nw ?? -1));
  const sub = d.players.filter(p => p.run?.status === 'submitted').length;
  return `<header><div class="mk">⚡</div><h1>MARKET GOD</h1><span class="mute xs">MARKET MAYHEM admin</span><span class="spacer"></span>
    <input id="week" value="${esc(ST.week)}" style="width:110px" aria-label="Week"><button id="wipe-all" class="sm danger" title="Every player starts over with $10,000">Reset everyone to $10k</button><button id="refresh">Refresh</button><button id="logout" class="sm">Lock</button></header>
  <main><div><div class="card"><h2>Players <span class="r">${d.players.length} players · ${sub} scores this week</span></h2>
    <div class="tw"><table><thead><tr><th>Player</th><th>Money</th><th>This week</th><th>Their market (secret)</th><th>Actions</th></tr></thead><tbody>${ps.map(playerRow).join('') || '<tr><td colspan="5" class="empty">No players yet. Share the game link.</td></tr>'}</tbody></table></div>
    <div class="xs mute" style="margin-top:8px">Vol scales how wildly their stocks move (0.25× calm to 4× chaos). Luck tilts the stocks they own: +1 drifts them up, −1 drags them down. Changes reach a player at their next game day. "Rigged" marks runs you touched; only you can see it.</div></div></div>
  <div>${godPanel()}${chalPanel()}</div></main>`;
}
const SHARK = { vinnie: "Vinnie 'The Calculator'", tony: "Big Tony's Easy Money", knuckles: 'Knuckles & Sons Capital', broker: 'Pemberton Prime Brokerage (margin)' };
const CONTACT = { dave: 'Dodgy Dave', clerk: 'The Night Clerk', banker: 'Silvia Marrow', director: 'The Director' };
const px2 = c => c == null ? '—' : '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const tbl = (head, rows, empty) => rows.length ? `<div class="tw"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<div class="empty">${empty}</div>`;
function inspectView(d) {
  const L = d.live, I = L?.insider || {};
  const sec = (t, body) => `<div class="card"><h2>${t}</h2>${body}</div>`;
  const pos = L ? tbl(['Stock', 'Shares', 'Avg cost', 'Price', 'Value', 'P/L'], (L.holdings || []).map(h => { const v = h.sh * h.px, pl = v - h.sh * h.avg; return `<tr><td class="b">${esc(h.tk)}</td><td class="mono">${Number(h.sh).toLocaleString('en-US')}</td><td class="mono">${px2(h.avg)}</td><td class="mono">${px2(h.px)}</td><td class="mono">${money(v)}</td><td class="mono ${pl >= 0 ? 'up' : 'down'}">${money(pl)}</td></tr>`; }), 'No stocks held.') : '';
  const shorts = L && (L.shorts || []).length ? tbl(['Short', 'Shares', 'Sold at', 'Price now', 'P/L'], L.shorts.map(h => { const pl = h.sh * (h.avg - h.px); return `<tr><td class="b">${esc(h.tk)}</td><td class="mono">${h.sh}</td><td class="mono">${px2(h.avg)}</td><td class="mono">${px2(h.px)}</td><td class="mono ${pl >= 0 ? 'up' : 'down'}">${money(pl)}</td></tr>`; }), '') : '';
  const debt = L ? (L.loans || []).reduce((a, l) => a + l.owed, 0) : 0;
  const loans = L ? tbl(['Lender', 'Borrowed', 'Owes now', 'Due', 'Strikes'], (L.loans || []).map(l => `<tr><td>${esc(SHARK[l.shark] || l.shark)}</td><td class="mono">${money(l.principal)}</td><td class="mono down b">${money(l.owed)}</td><td class="${l.due < 0 ? 'down b' : l.due < 2 ? 'gold' : ''}">${l.due < 0 ? 'OVERDUE ' + Math.abs(l.due) + ' days' : 'in ' + l.due + ' days'}</td><td>${l.strikes || 0}</td></tr>`), 'Owes nothing to the sharks.')
    + ((L.loanHist || []).length ? `<div class="xs mute" style="margin-top:8px">History: ${L.loanHist.slice().reverse().map(h => `${esc(SHARK[h.shark] || h.shark)} ${esc(h.outcome)} (${esc(h.date)})`).join(' · ')}</div>` : '') + (L.sharkBan ? '<div class="xs down">Banned from borrowing right now.</div>' : '') : '';
  const heatName = h => h < 20 ? 'Low' : h < 50 ? 'Noticed' : h < 90 ? 'High' : 'Critical';
  const insider = L ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${I.unlocked ? '<span class="chip y">network open</span>' : '<span class="chip">not unlocked</span>'}<span class="chip ${I.heat >= 50 ? 'r' : I.heat >= 20 ? 'y' : ''}">heat ${I.heat ?? 0} · ${heatName(I.heat || 0)}</span><span class="chip">${I.met || 0} contact(s) met</span>${I.caseOpen ? '<span class="chip r">under investigation</span>' : ''}${I.suspended ? '<span class="chip r">suspended</span>' : ''}${I.banned ? '<span class="chip r">banned from network</span>' : ''}</div>
    <div class="xs mute" style="margin:6px 0 4px">Tips bought</div>${tbl(['When', 'From', 'Tip', 'Was it true?', 'Paid'], (I.tips || []).slice().reverse().map(x => `<tr><td class="xs">${esc(x.date)}</td><td>${esc(CONTACT[x.contact] || x.contact)}</td><td><b>${esc(x.tk)}</b> ${x.dir > 0 ? '<span class="up">going up</span>' : '<span class="down">going down</span>'}</td><td>${x.real ? '<span class="up">real</span>' : '<span class="mute">made up</span>'}</td><td class="mono">${money(x.cost)}</td></tr>`), 'No tips bought.')}
    <div class="xs mute" style="margin:10px 0 4px">Trades the Securities Commission flagged</div>${tbl(['When', 'Stock', 'Side', 'Shares', 'Price', 'On a tip?'], (I.flagged || []).slice().reverse().map(x => `<tr><td class="xs">${esc(x.date)}</td><td class="b">${esc(x.tk)}</td><td>${esc(x.side)}</td><td class="mono">${x.sh}</td><td class="mono">${px2(x.px)}</td><td>${x.tip ? '<span class="chip r">yes</span>' : 'hype dump'}</td></tr>`), 'Nothing flagged.')}
    ${(I.history || []).length ? `<div class="xs mute" style="margin-top:8px">Cases: ${I.history.map(h => `${esc(h.outcome)}${h.fine ? ' ' + money(h.fine) : ''} (${esc(h.date)})`).join(' · ')}</div>` : ''}` : '';
  const TYPE = { buy: 'Bought', sell: 'Sold', short: 'Shorted', cover: 'Covered', tip: 'Bought a tip', loan: 'Borrowed', repay: 'Repaid', dividend: 'Dividend', item: 'Bought toy', pawn: 'Pawned' };
  const log = L ? tbl(['When', 'What', 'Stock', 'Shares', 'Price', 'Amount', 'P/L'], (L.log || []).slice().reverse().map(x => `<tr><td class="xs">${esc(x.date)}</td><td>${esc(TYPE[x.type] || x.type)}${x.type === 'tip' ? ' <span class="xs mute">from ' + esc(CONTACT[x.src] || x.src) + '</span>' : x.type === 'loan' ? ' <span class="xs mute">from ' + esc(SHARK[x.src] || x.src) + '</span>' : ''}</td><td class="b">${esc(x.tk)}</td><td class="mono">${x.sh || ''}</td><td class="mono">${x.price ? px2(x.price) : ''}</td><td class="mono">${x.total ? money(x.total) : ''}</td><td class="mono ${x.pnl == null ? '' : x.pnl >= 0 ? 'up' : 'down'}">${x.pnl == null ? '' : money(x.pnl)}</td></tr>`), 'No activity yet.') : '';
  const runs = tbl(['Week / duel', 'Status', 'Result'], (d.runs || []).map(r => `<tr><td>${esc(String(r.week).startsWith('duel-') ? '1v1 duel' : r.week)}</td><td>${esc(r.status)}${r.rigged ? ' <span class="chip y">rigged</span>' : ''}</td><td class="mono">${r.nw ? money(r.nw) + ' ' + pctS(r.ret) : ''}</td></tr>`), 'No ranked runs yet.');
  const duels = (d.duels || []).length ? `<div class="xs mute" style="margin-top:8px">Duels: ${d.duels.map(x => `vs ${esc(x.vs)} (${esc(x.status)})`).join(' · ')}</div>` : '';
  return `<div id="insp-back" style="position:fixed;inset:0;background:#0009;z-index:20;display:flex;justify-content:flex-end">
  <div style="width:min(760px,100%);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--line);padding:14px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><h1 style="font-size:18px">${esc(d.player.nickname)}</h1>${d.player.banned ? '<span class="chip r">banned</span>' : ''}<span class="spacer"></span><button id="insp-x">Close</button></div>
  ${L ? `<div class="card"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">
    <div><div class="xs mute">Net worth</div><div class="mono b" style="font-size:20px">${money(L.nw)}</div></div>
    <div><div class="xs mute">Cash</div><div class="mono b" style="font-size:20px">${money(L.cash)}</div></div>
    <div><div class="xs mute">Owes loan sharks</div><div class="mono b ${debt > 0 ? 'down' : ''}" style="font-size:20px">${money(debt)}</div></div>
    <div><div class="xs mute">Level</div><div class="b" style="font-size:20px">${d.career?.level ?? 0}</div></div></div>
    <div class="xs mute" style="margin-top:8px">Playing ${esc(L.mode)} · game date ${esc(L.date)} · snapshot ${ago(d.updated)} · last seen ${ago(d.player.lastSeen)} · joined ${ago(d.player.created)}</div></div>`
    : `<div class="card"><div class="empty">This player has not sent a game snapshot yet. It arrives once they play with the updated game.</div></div>`}
  ${L ? sec('Portfolio', pos + (shorts ? '<div style="margin-top:10px"></div>' + shorts : '')) : ''}
  ${L ? sec('Loan sharks', loans) : ''}
  ${L ? sec('Insider trading', insider) : ''}
  ${L ? sec('Recent activity', log) : ''}
  ${sec('Ranked runs and duels', runs + duels)}
  </div></div>`;
}
function render() { $('app').innerHTML = (KEY ? mainView() : loginView()) + (KEY && ST.inspect ? inspectView(ST.inspect) : ''); }

document.addEventListener('submit', e => { if (e.target.id === 'lf') { e.preventDefault(); KEY = $('pw').value; sessionStorage.setItem('mm.admin', KEY); render(); load(); } });
document.addEventListener('input', e => {
  const k = e.target.dataset.k, tr = e.target.closest('tr');
  if (k === 'vol' && tr) tr.querySelector('[data-o=vol]').textContent = volLabel(2 ** Number(e.target.value));
  if (k === 'luck' && tr) { const v = Number(e.target.value); tr.querySelector('[data-o=luck]').textContent = (v > 0 ? '+' : '') + v.toFixed(2); }
  if (e.target.id === 'cf-title') CF.title = e.target.value;
  if (e.target.id === 'cf-start') CF.start = Number(e.target.value);
  if (e.target.id === 'cf-prize') CF.prize = Number(e.target.value);
  if (e.target.id === 'ev-mag') { ST.ev.mag = Number(e.target.value); syncEv(); }
  if (e.target.id === 'ev-amt') { ST.ev.amt = e.target.value; const b = $('ev-go'); if (b) b.disabled = !(ST.ev.ticker && Number(ST.ev.amt) > 0); const im = document.querySelector('.impact'); if (im) im.textContent = (ST.ev.dir > 0 ? '+' : '−') + (ST.ev.unit === 'usd' ? '$' : '') + (ST.ev.amt || 0) + (ST.ev.unit === 'usd' ? '' : '%'); }
  if (['ev-who', 'ev-text'].includes(e.target.id)) { ST.ev[e.target.id === 'ev-who' ? 'who' : 'text'] = e.target.value; const pv = document.querySelector('.preview .b'); if (pv) pv.textContent = `${ST.ev.who || 'A Very Important Person'}: "${ST.ev.text || '…'}"`; }
});
function syncEv() { const box = document.querySelector('.impact'); if (!box) return; const e = ST.ev, isA = e.kind === 'announce', v = isA ? e.mag : (e.kind === 'boom' ? 1 : -1) * Math.abs(e.mag); box.textContent = (v >= 0 ? '+' : '−') + Math.abs(v) + '%'; box.className = 'impact ' + (v >= 0 ? 'up' : 'down'); }
document.addEventListener('change', e => {
  if (e.target.dataset.pick) { CF.sel[e.target.dataset.pick] = e.target.checked; return; }
  if (e.target.id === 'cf-days') { CF.days = Number(e.target.value); return; }
  if (e.target.id === 'ev-ticker') { ST.ev.ticker = e.target.value; render(); }
  if (e.target.id === 'ev-target') ST.ev.target = e.target.value;
  if (e.target.id === 'ev-dur') { ST.ev.dur = Number(e.target.value); render(); }
  if (e.target.id === 'ev-amt') render();
  if (e.target.id === 'ev-day') ST.ev.day = e.target.value;
  if (e.target.id === 'week') { ST.week = e.target.value.trim(); ST.companies = []; load(); }
});
document.addEventListener('click', e => {
  if (e.target.id === 'insp-back' || e.target.id === 'insp-x') { ST.inspect = null; return render(); }
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'refresh') return load();
  if (b.id === 'wipe-all') { if (!confirm('Reset EVERY player to a fresh $10,000 career? Their current games are replaced. Ranked runs and duels are not touched.')) return; return act('reset', {}, 'Everyone goes back to $10,000 next time they play'); }
  if (b.id === 'logout') { KEY = ''; sessionStorage.removeItem('mm.admin'); return render(); }
  if (b.dataset.goal) { CF.goal = b.dataset.goal; return render(); }
  if (b.dataset.pickall) { const ps = ST.data?.players || [], on = !ps.every(p => CF.sel[p.id]); ps.forEach(p => { CF.sel[p.id] = on; }); return render(); }
  if (b.id === 'cf-go') { const ids = Object.keys(CF.sel).filter(k => CF.sel[k]); if (!ids.length) return toast('Pick at least one player', 1); return act('challenge_create', { title: CF.title, goal: CF.goal, startCash: CF.start, prize: CF.prize, days: CF.days, playerIds: ids }, `Challenge sent to ${ids.length} player${ids.length === 1 ? '' : 's'}`); }
  if (b.dataset.cclose) { if (!confirm('End this challenge now and pay the prize to whoever is on top?')) return; return api('challenge_close', { id: b.dataset.cclose }).then(r => { toast(r.winner ? `${r.winner} wins ${usd(r.prize / 100)}` : 'Ended. Nobody finished, so no prize.'); load(); }, e2 => toast(e2.message, 1)); }
  if (b.dataset.dir) { ST.ev.dir = Number(b.dataset.dir); return render(); }
  if (b.dataset.unit) { ST.ev.unit = b.dataset.unit; ST.ev.amt = b.dataset.unit === 'usd' ? 10 : 25; return render(); }
  if (b.dataset.ev) { ST.ev.kind = b.dataset.ev; if (b.dataset.ev !== 'announce') ST.ev.mag = Math.max(1, Math.abs(ST.ev.mag)); return render(); }
  if (b.id === 'ev-rug') { Object.assign(ST.ev, { kind: 'announce', dir: -1, unit: 'pct', amt: 85, dur: 0, who: 'The Developers', text: 'We have decided to pursue other opportunities. Thank you for your support.' }); toast('Rug pull filled in. Pick the company, then Unleash it.'); return render(); }
  if (b.id === 'ev-go') { const v = ST.ev, isA = v.kind === 'announce'; return act('event', isA ? { kind: 'announce', unit: v.unit, amount: v.dir * Number(v.amt), duration: v.dur, ticker: v.ticker, speaker: v.who, headline: v.text, day: v.day, playerId: v.target || null } : { kind: v.kind, magnitude: Math.abs(v.mag) / 100, day: v.day, playerId: v.target || null }, isA ? `Announcement queued: ${v.ticker} ${v.dir > 0 ? '+' : '−'}${v.unit === 'usd' ? '$' : ''}${v.amt}${v.unit === 'usd' ? '' : '%'}` : `${v.kind} queued`).then(() => { ST.ev.text = ''; render(); }); }
  const tr = b.closest('tr'); if (!tr) return; const playerId = tr.dataset.id, a = b.dataset.a, p = ST.data.players.find(x => x.id === playerId), name = p?.nickname;
  if (a === 'inspect') { return api('inspect', { playerId }).then(d => { ST.inspect = d; render(); }, e2 => toast(e2.message, 1)); }
  if (a === 'mods') return act('mods', { playerId, vol: 2 ** Number(tr.querySelector('[data-k=vol]').value), luck: Number(tr.querySelector('[data-k=luck]').value) }, `Updated ${name}'s market`);
  if (a === 'normal') return act('mods', { playerId, vol: 1, luck: 0 }, `${name} is back to a fair market`);
  if (a === 'wipe') { if (!confirm(`Reset ${name} to a fresh $10,000 career? Their current game is replaced.`)) return; return act('reset', { playerIds: [playerId] }, `${name} goes back to $10,000 next time they play`); }
  if (a === 'cash') { const v = Number(tr.querySelector('[data-k=cash]').value); if (!v) return toast('Enter an amount', 1); return act('cash', { playerId, amount: v, note: tr.querySelector('[data-k=note]').value }, `${v > 0 ? 'Sent' : 'Fined'} ${name} $${Math.abs(v).toLocaleString('en-US')}`); }
  if (a === 'ban') { const reason = prompt(`Ban ${name}? Reason (shown to them):`, 'Cheating'); if (reason == null) return; return act('ban', { playerId, banned: true, reason }, `${name} banned`); }
  if (a === 'unban') return act('ban', { playerId, banned: false }, `${name} unbanned`);
  if (a === 'unlock') return act('unlock', { playerId }, `${name} unlocked`);
  if (a === 'pin') { const pin = prompt(`New 4-digit PIN for ${name}:`); if (!pin) return; return act('resetPin', { playerId, pin }, `${name}'s PIN changed`); }
  if (a === 'reset') { if (!confirm(`Delete ${name}'s run this week? They can start again.`)) return; return act('resetRun', { runId: p.run.id }, `${name}'s run reset`); }
  if (a === 'remove') { if (!confirm(`Remove ${name}'s score from the leaderboard?`)) return; return act('removeRun', { runId: p.run.id }, `${name}'s score removed`); }
});
render(); if (KEY) load();
setInterval(() => { if (KEY && !ST.inspect && document.visibilityState === 'visible' && !document.activeElement?.matches('input,textarea,select')) load(); }, 20000);
</script>
</body>
</html>
