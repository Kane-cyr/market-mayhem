<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234c8dff%27/%3E%3Cpath d=%27M6 22l7-8 5 5 8-11%27 stroke=%27white%27 stroke-width=%273%27 fill=none/%3E%3C/svg%3E"><title>MARKET MAYHEM</title><style>/* MARKET MAYHEM: a dense, flat trading-terminal UI in the TradingView mould.
   Surfaces separate by lightness and hairline borders. The chart is the hero; chrome stays quiet. */
:root{--bg:#0f121a;--bg2:#131722;--panel:#161a25;--panel2:#1f2430;--panel3:#2a2e39;--line:#232836;--line2:#2f3545;--grid:#1c2130;--text:#d1d4dc;--dim:#a3a6af;--mute:#787b86;--up:#089981;--down:#f23645;--gold:#f7a600;--blue:#2962ff;--accent:#2962ff;--r:4px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,"Trebuchet MS",sans-serif;--mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;--topH:46px;--stH:26px;--bnH:58px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior:none}
.ic{flex:none;vertical-align:-3px}
button{font:inherit;font-weight:500;color:var(--text);cursor:pointer;border:1px solid var(--line2);background:transparent;border-radius:var(--r);padding:5px 10px;transition:background .12s,border-color .12s,color .12s;-webkit-tap-highlight-color:transparent}
button:hover{background:var(--panel2)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.primary:hover{background:#1e4fd6}
button.buy{background:var(--up);border-color:var(--up);color:#fff;font-weight:600}button.buy:hover{background:#07806d}button.sell{background:var(--down);border-color:var(--down);color:#fff;font-weight:600}button.sell:hover{background:#d42c3a}
button.exec{padding:10px;font-size:14px;width:100%}
button.ghost{border-color:transparent;color:var(--dim)}button.ghost:hover{color:var(--text)}button.sm{padding:2px 8px;font-size:12px}button.on{background:var(--panel3);border-color:var(--line2);color:#fff}
.iconbtn{border:0;padding:6px;display:grid;place-items:center;color:var(--dim)}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:6px 9px;width:100%}input:focus,select:focus{border-color:var(--accent);outline:none}
a{color:#5b8cff;text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}.mono{font-family:var(--mono);font-size:.94em}.mute{color:var(--mute)}.dim{color:var(--dim)}.gold{color:var(--gold)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:600}.right,.r{text-align:right}.center{text-align:center}.spacer{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:48px minmax(0,1fr) 280px;grid-template-rows:var(--topH) minmax(0,1fr) var(--stH);grid-template-areas:"top top top" "nav main side" "st st st";height:100vh;height:100dvh}
.top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 10px 0 8px;border-bottom:1px solid var(--line);background:var(--bg2);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.04em;white-space:nowrap;color:var(--text)}.brand:hover{text-decoration:none}.brand .mk{width:28px;height:28px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:#fff}
.symsearch{position:relative;width:170px}.symsearch input{padding:0 8px 0 28px;height:30px;background:var(--bg);border-color:var(--line2)}.symsearch .ic{position:absolute;left:9px;top:8px;color:var(--mute)}
.tgroup{display:flex;align-items:center;gap:8px;min-width:0}
.clock{display:flex;flex-direction:column;line-height:1.15;font-size:12px;white-space:nowrap;min-width:84px}.clock b{font-weight:600}.clock span{color:var(--mute);font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:var(--bg)}.top .tgroup .seg{flex-shrink:0}@media(min-width:761px){.top .tgroup{min-width:440px}.top .tgroup .clock{flex:1 1 auto;min-width:0;overflow:hidden}.top .tgroup .clock>*{overflow:hidden;text-overflow:ellipsis}}.top .acct{min-width:0;flex-shrink:1;overflow:hidden}.top .acct .stat{min-width:0}.top .acct .v{display:block;overflow:hidden;text-overflow:ellipsis}.seg button{border:0;border-radius:0;padding:4px 9px;font-size:12px;color:var(--dim);display:inline-flex;align-items:center;gap:5px;height:28px}.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--panel3);color:#fff}.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}
.seg.speed button.on{background:var(--accent);color:#fff}
.acct{display:flex;gap:18px}.stat{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap}.stat .l{font-size:11px;color:var(--mute)}.stat .v{font-size:13px;font-weight:600}
.sidebtn{display:none}
.nav{grid-area:nav;border-right:1px solid var(--line);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg2)}
.nav a{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:var(--r);color:var(--mute)}.nav a:hover{background:var(--panel2);color:var(--text);text-decoration:none}.nav a.on{color:#fff;background:var(--panel3)}.nav a.dimmed{opacity:.45}
.badge{position:absolute;top:2px;right:1px;background:var(--down);color:#fff;border-radius:99px;font-size:9px;padding:0 4px;font-weight:700;line-height:14px;min-width:14px;text-align:center}
.nav .grow{flex:1}.nav .lv{font-size:10px;color:var(--mute);text-align:center;margin-bottom:4px;line-height:1.2}.nav button{border:0;padding:0;width:38px;height:34px;display:grid;place-items:center;color:var(--mute)}
main{grid-area:main;overflow:auto;padding:12px 14px 40px;min-width:0;background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--panel3) transparent}
.side{grid-area:side;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
.side .hd,.side-like .hd{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);height:38px}.hd button{border:0;border-radius:var(--r);padding:4px 8px;color:var(--mute);font-weight:600;font-size:12px}.hd button.on{color:#fff;background:var(--panel3)}
.side .cols,.side .row,.side-like .cols,.side-like .row{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:6px;padding:0 12px;align-items:center}.cols{font-size:11px;color:var(--mute);padding-top:7px!important;padding-bottom:4px!important}
.side .list{overflow:auto;flex:1;scrollbar-width:thin}.row{height:32px;cursor:pointer;border-left:2px solid transparent}.row:hover{background:var(--panel2)}.row.sel{background:var(--panel2);border-left-color:var(--accent)}.row .s{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}.row .s>span:last-child{overflow:hidden;text-overflow:ellipsis}.row .s .logo{width:18px;height:18px}.row .p,.row .c{text-align:right;font-size:12px}
.idxmk{display:grid;place-items:center;width:18px;height:18px;border-radius:3px;background:var(--panel3);font-size:7px;font-weight:700;color:var(--dim)}
.status{grid-area:st;display:flex;align-items:center;gap:0;border-top:1px solid var(--line);background:var(--bg2);font-size:11.5px;min-width:0;overflow:hidden}
.status .it{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;border-right:1px solid var(--line);white-space:nowrap;cursor:default}.status [data-act]{cursor:pointer}.status [data-act]:hover{background:var(--panel2)}
.status .head{flex:1;min-width:0;overflow:hidden}.status .head .dim{overflow:hidden;text-overflow:ellipsis}.status .hot{background:var(--down);color:#fff;font-weight:700;font-size:10px;letter-spacing:.06em;padding:1px 5px;border-radius:2px}.status .it:last-child{border-right:0;margin-left:auto}
.status .wx .ic{width:14px;height:14px}.wx.panic{color:var(--down)}.wx.sunshine,.wx.recovery{color:var(--up)}.wx.thunder,.wx.volatile{color:var(--gold)}
.bnav,#sheet .sheet,.mtrade,.closesheet{display:none}

/* ---------- content primitives ---------- */
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:1fr 2fr}.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}.card.flush{padding:0;overflow:hidden}
.card h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.05em}.card h3 .r{margin-left:auto;font-weight:400;color:var(--mute);font-size:12px;text-transform:none;letter-spacing:0}
h1{font-size:17px;font-weight:600;margin:0 0 2px}h2{font-size:14px;margin:0 0 8px}.sub{color:var(--mute);margin:0 0 12px;font-size:12px}
.ph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}.ph h1{margin:0}.ph .sub{margin:0}
.filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.filters input{max-width:260px}.filters select{max-width:180px}
.big{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.1;font-family:var(--mono)}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:var(--mute);text-align:left;padding:6px 8px;font-weight:500;white-space:nowrap;border-bottom:1px solid var(--line)}td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}th.r,td.r{text-align:right}tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.co{display:flex;align-items:center;gap:9px}.co .n{font-weight:600;line-height:1.15}.co .t{font-size:11px;color:var(--mute)}
.chip{display:inline-block;padding:0 6px;border-radius:3px;font-size:11px;line-height:18px;background:var(--panel3);color:var(--dim);white-space:nowrap;font-weight:500}.chip.g{background:#08998122;color:#22ab94}.chip.r{background:#f2364522;color:#f7525f}.chip.y{background:#f7a60022;color:var(--gold)}.chip.b{background:#2962ff22;color:#6f97ff}.chip.v{background:#7e57c222;color:#a98be0}
.tabs{display:flex;gap:2px;margin:-4px 0 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:7px 10px;color:var(--mute);font-weight:600;margin-bottom:-1px}.tabs button:hover{background:none;color:var(--text)}.tabs button.on{background:none;color:#fff;border-bottom-color:var(--accent)}
.news{display:flex;flex-direction:column}.news .item{padding:9px 0;border-bottom:1px solid var(--line)}.news .item:last-child{border-bottom:0}.news .h{font-weight:600;margin:3px 0 2px;font-size:13.5px}.news .meta{font-size:11px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center}.news .body{color:var(--dim)}
.news .item.sev4,.news .item.sev5{padding-left:10px;box-shadow:inset 2px 0 var(--down)}.news .item.prem{padding-left:10px;box-shadow:inset 2px 0 var(--gold)}
.post{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.post:last-child{border-bottom:0}.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#131722;cursor:pointer}.post .hd{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.post .acts{display:flex;gap:16px;color:var(--mute);font-size:12px;margin-top:5px}
.tk{color:#5b8cff;cursor:pointer;font-weight:600}.tk:hover{text-decoration:underline}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px}.heat .cell{padding:9px 10px;border-radius:3px;cursor:pointer;border:1px solid transparent}.heat .cell:hover{border-color:var(--line2)}
.mix{display:flex;height:6px;border-radius:2px;overflow:hidden;background:var(--panel3);gap:1px}.mix i{display:block;height:100%}
.sw8{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0}
.bar{height:4px;border-radius:2px;background:var(--panel3);overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
.gauge{height:6px;border-radius:3px;background:linear-gradient(90deg in oklch,var(--up),var(--gold),var(--down));position:relative}.gauge i{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:#fff;transition:left .5s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}.kv span:nth-child(odd){color:var(--mute)}.kv span:nth-child(even){text-align:right;font-weight:500}
.banner{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:var(--r);border:1px solid #f2364544;background:#f2364512;margin-bottom:10px}
.empty{padding:18px;text-align:center;color:var(--mute)}
.logo{flex:none}.spark.up{color:var(--up)}.spark.down{color:var(--down)}
.rank{display:grid;grid-template-columns:34px 1fr 110px 90px 80px;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}.rank.me{background:#2962ff1f;border-radius:3px}
.ach{display:flex;gap:10px;padding:8px;border:1px solid var(--line);border-radius:3px;opacity:.45}.ach.got{opacity:1;border-color:#f7a60066}.ach .ic{font-size:16px;width:24px;text-align:center;color:var(--gold)}
.locked{border-style:dashed;color:var(--mute)}.locked h3{color:var(--mute)}
.alloc{display:grid;grid-template-columns:minmax(0,1.3fr) 76px 52px 66px minmax(0,1.6fr);gap:10px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line);font-size:12.5px}.alloc.h{font-size:11px;color:var(--mute);padding-top:2px}.alloc:last-child{border-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.tile{padding:8px 10px;border:1px solid var(--line);border-radius:3px;cursor:pointer;display:flex;flex-direction:column;gap:2px}.tile:hover{background:var(--panel2)}
.legend{display:flex;flex-direction:column;gap:3px;font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* ---------- symbol workspace (company page) ---------- */
.ws{display:flex;flex-direction:column;gap:10px}
.symbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 2px 0}
.symbar .nm{line-height:1.2}.symbar .nm b{font-size:16px}.star{border:0;padding:2px;color:var(--mute);vertical-align:-2px}.star.on{color:var(--gold)}
.symbar .px{display:flex;align-items:baseline;gap:8px}.symbar .px .v{font-size:22px;font-weight:600}.symbar .chips{display:flex;gap:6px;flex-wrap:wrap}
.wsgrid{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:10px;align-items:start}
.chartpane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.ctool{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}.ctool .hint{white-space:nowrap;display:none}@media(min-width:1500px){.ctool .hint{display:inline}}
.dtools{display:inline-flex;gap:2px;padding-left:8px;border-left:1px solid var(--line)}.dtools button{border:0;width:30px;height:28px;padding:0;display:grid;place-items:center;color:var(--dim)}.dtools button.on{background:#2962ff26;color:#6f97ff}
.chartbox{height:clamp(360px,calc(100dvh - 250px),760px);position:relative}.chartbox canvas{width:100%;height:100%;display:block}
.tpane{display:flex;flex-direction:column;gap:10px;position:sticky;top:0}.pane{padding:12px}
.ticket{display:flex;flex-direction:column;gap:8px}.ticket .bs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ticket .bs button{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:6px 10px;line-height:1.25;border-color:var(--line2)}.ticket .bs button span{font-size:11px;color:var(--mute)}.ticket .bs button b{font-size:14px}
.ticket .bs .b.on{background:#08998120;border-color:var(--up)}.ticket .bs .b.on b{color:#22ab94}.ticket .bs .s.on{background:#f2364520;border-color:var(--down)}.ticket .bs .s.on b{color:#f7525f}
.fld{display:flex;flex-direction:column;gap:3px}.fld span{font-size:11px;color:var(--mute)}.fld input{height:34px;font-family:var(--mono)}
.est{display:flex;flex-direction:column;gap:3px;font-size:12px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.est>div{display:flex;justify-content:space-between}.est>div>span:first-child{color:var(--mute)}.est .tot{font-weight:600;font-size:13px}.est .tot span:first-child{color:var(--text)!important}
.orow{display:flex;justify-content:space-between;align-items:center;padding:3px 0}

/* ---------- insider ---------- */
.contact{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.contact:last-of-type{border-bottom:0}.contact .av{background:var(--panel3);color:var(--dim);cursor:default}.contact .buy{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tip{padding:9px 0;border-bottom:1px solid var(--line)}.tip:last-child{border-bottom:0}.tip .meta{display:flex;gap:5px;flex-wrap:wrap}.tip .q{font-size:13.5px;margin-top:2px}.tip.old{opacity:.55}
.heatbar{height:6px;border-radius:3px;background:var(--panel3);overflow:hidden;margin-bottom:10px}.heatbar i{display:block;height:100%;background:linear-gradient(90deg in oklch,var(--gold),var(--down))}

/* ---------- insider ladder + loan sharks ---------- */
.contact.unmet{opacity:.75}.accrow{display:flex;align-items:center;gap:8px;margin-top:4px}.acc{width:90px;height:4px;border-radius:2px;background:var(--panel3);overflow:hidden}.acc i{display:block;height:100%;background:linear-gradient(90deg in oklch,var(--down),var(--gold),var(--up))}
.loan{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.loan:last-child{border-bottom:0}.loan.late{box-shadow:inset 3px 0 var(--down);padding-left:10px}.loan .acts{display:flex;gap:6px}
.shark .sh-hd{display:flex;gap:12px;align-items:center}.av.big{width:40px;height:40px;font-size:16px;background:#f2364526;color:#f7525f;cursor:default}
.stat.debt{color:inherit}.stat.debt:hover{text-decoration:none}
.flash{position:fixed;top:calc(var(--topH) + 8px);left:50%;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:10px;max-width:min(720px,94vw);padding:6px 8px 6px 6px;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--down);border-radius:var(--r);box-shadow:0 10px 30px #0008;animation:slide .2s both}
.flash .tag{background:var(--down);color:#fff;font-weight:700;font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:2px;white-space:nowrap}.flash .h{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cut .bc-top{border-bottom-color:var(--gold)}.cut .bc-tag{background:#7a5a00}.cut-loan .bc-tag,.cut-collect1 .bc-tag,.cut-collect2 .bc-tag{background:#8c1d3b}.cut .bc-sub{bottom:46px}
.neon{animation:neon 3s steps(1) infinite}@keyframes neon{0%,100%{opacity:1}47%{opacity:.4}49%{opacity:1}52%{opacity:.6}}.smoke{animation:smoke 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes smoke{50%{transform:translateY(-8px);opacity:.4}}

/* ---------- shorts, moves, lifestyle, weekly ---------- */
.shortseg button{height:26px!important}.shortseg button.on.sh{background:#f2364526;color:#f7525f}
.moves{display:flex;flex-direction:column}.mv{display:grid;grid-template-columns:50px 46px auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}.mv:last-child{border-bottom:0}.mv .why{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mv .chip{justify-self:start}
